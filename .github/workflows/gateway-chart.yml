name: Gateway chart

# Publishes charts/gateway-crds and charts/gateway as OCI charts at
# ghcr.io/5stackgg/charts/<name>, tagged with the version in their Chart.yaml.
on:
  push:
    branches: [main]
    paths:
      - "charts/gateway/**"
      - "charts/gateway-crds/**"
      - .github/workflows/gateway-chart.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      # A published version is never pushed again: whoever installed it keeps
      # getting the chart they installed. Bump Chart.yaml's version to publish.
      - run: |
          for dir in charts/gateway-crds charts/gateway; do
            name="$(yq -r .name "$dir/Chart.yaml")"
            version="$(yq -r .version "$dir/Chart.yaml")"
            if helm show chart "oci://ghcr.io/5stackgg/charts/$name" --version "$version" >/dev/null 2>&1; then
              echo "$name $version is already published"
              continue
            fi
            helm package "$dir" --destination dist
            helm push "dist/$name-$version.tgz" oci://ghcr.io/5stackgg/charts
          done
