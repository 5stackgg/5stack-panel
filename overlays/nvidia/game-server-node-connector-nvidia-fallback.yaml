apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: game-server-node-connector-nvidia-fallback
  name: game-server-node-connector-nvidia-fallback
  namespace: 5stack
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app: game-server-node-connector-nvidia-fallback
  template:
    metadata:
      labels:
        app: game-server-node-connector-nvidia-fallback
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: game-server-node-connector
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia-gpu
                    operator: In
                    values: ["true"]
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - image: ghcr.io/5stackgg/game-server-node-connector:latest
          name: game-server-node-connector
          resources:
            requests:
              memory: "64Mi"
            limits:
              memory: "4Gi"
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NVIDIA_DRIVER_FALLBACK
              value: "true"
          envFrom:
            - secretRef:
                name: hasura-secrets
            - secretRef:
                name: redis-secrets
          volumeMounts:
            - name: server-files
              mountPath: /serverfiles
            - name: csgo-server-files
              mountPath: /serverfiles-csgo
            - name: demos
              mountPath: /demos
            - name: dedicated-servers
              mountPath: /servers
            - name: custom-plugins
              mountPath: /custom-plugins
            - name: manifests
              mountPath: /pod-manifests
            - name: containerd-sock
              mountPath: /containerd.sock
              readOnly: true
            - name: cpu-sys
              mountPath: /host-cpu
              readOnly: true
            - name: host-apt
              mountPath: /host-apt
              readOnly: true
            - name: host-run
              mountPath: /host-run
              readOnly: true
            - name: host-dpkg
              mountPath: /host-dpkg
              readOnly: true
            - name: host-5stack
              mountPath: /host-5stack
              readOnly: true
              mountPropagation: HostToContainer
      volumes:
        - name: server-files
          hostPath:
            path: /opt/5stack/serverfiles
            type: DirectoryOrCreate
        - name: csgo-server-files
          hostPath:
            path: /opt/5stack/serverfiles-csgo
            type: DirectoryOrCreate
        - name: demos
          hostPath:
            path: /opt/5stack/demos
            type: DirectoryOrCreate
        - name: dedicated-servers
          hostPath:
            path: /opt/5stack/servers
            type: DirectoryOrCreate
        - name: custom-plugins
          hostPath:
            path: /opt/5stack/custom-plugins
            type: DirectoryOrCreate
        - name: manifests
          hostPath:
            path: /var/lib/rancher/k3s/agent/pod-manifests
            type: Directory
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
        - name: cpu-sys
          hostPath:
            path: /sys/devices/system/cpu/
        - name: host-apt
          hostPath:
            path: /etc/apt
            type: DirectoryOrCreate
        - name: host-run
          hostPath:
            path: /run
            type: Directory
        - name: host-dpkg
          hostPath:
            path: /var/lib/dpkg
            type: DirectoryOrCreate
        - name: host-5stack
          hostPath:
            path: /opt/5stack
            type: DirectoryOrCreate
