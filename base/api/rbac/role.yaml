apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-creator-role
  namespace: 5stack
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ''
    resources:
      - services
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ''
    resources:
      - serviceaccounts
    verbs:
      - get
      - list
  # create: a stream sent to Twitch reads its key from a Secret owned by its
  # Job, which Kubernetes deletes with the Job.
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
  - apiGroups:
      - ''
    resources:
      - pods/exec
    verbs:
      - create
      - get
  - apiGroups:
      - ''
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ''
    resources:
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ''
    resources:
      - persistentvolumeclaims
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - 'batch'
    resources:
      - jobs
      - jobs/status
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - get
  - apiGroups:
      - 'apps'
    resources:
      - deployments
    verbs:
      - create
      - get
      - list
      - watch
      - patch
      - delete
  - apiGroups:
      - ''
    resources:
      - configmaps
    resourceNames:
      - 5stack-agent
    verbs:
      - get
      - watch
  - apiGroups:
      - ''
    resources:
      - configmaps
    resourceNames:
      - 5stack-agent-requests
    verbs:
      - get
      - watch
      - patch
  - apiGroups:
      - networking.k8s.io
    resources:
      - networkpolicies
    resourceNames:
      - chat-video-faststart
    verbs:
      - get
