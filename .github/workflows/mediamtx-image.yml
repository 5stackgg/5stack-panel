name: MediaMTX image

on:
  push:
    branches: [main]
    paths:
      - "images/mediamtx/**"
      - .github/workflows/mediamtx-image.yml
  pull_request:
    paths:
      - "images/mediamtx/**"
      - .github/workflows/mediamtx-image.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mediamtx:1.21.3-astits117" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: images/mediamtx
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}
