apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hasura-dashboard
  namespace: 5stack
spec:
  parentRefs:
    - name: 5stack
      sectionName: hasura-dashboard
  hostnames:
    - hasura.5stack.localhost
  rules:
    - backendRefs:
        - name: hasura
          port: 8080
