apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: server-creator-clusterrole
rules:
  # Nodes are cluster-scoped: patch labels game server nodes, delete removes
  # the Node of one that was removed from the panel and stayed NotReady
  - apiGroups:
      - ''
    resources:
      - nodes
    verbs:
      - get
      - list
      - patch
      - delete
  # PVs are cluster-scoped — server-creator provisions per-node game server volumes
  - apiGroups:
      - ''
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
