apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - config
  - secrets
  # - dev-game-server
  # - dev-game-streamer
  - queues
  - hasura
  - https-redirect.yaml

replacements:
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.WEB_DOMAIN
    targets:
      - select:
          kind: HTTPRoute
          name: api-web
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: HTTPRoute
          name: web
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=web].hostname
      - select:
          kind: Certificate
          name: 5stack-ssl
        fieldPaths:
          - spec.dnsNames.0
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.hostnames.0
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.API_DOMAIN
    targets:
      - select:
          kind: HTTPRoute
          name: api
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: HTTPRoute
          name: hasura
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=api].hostname
      - select:
          kind: Certificate
          name: 5stack-ssl
        fieldPaths:
          - spec.dnsNames.1
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.hostnames.1
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.DEMOS_DOMAIN
    targets:
      - select:
          kind: HTTPRoute
          name: demos
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=demos].hostname
      - select:
          kind: Certificate
          name: 5stack-ssl
        fieldPaths:
          - spec.dnsNames.2
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.hostnames.2
  - source:
      kind: ConfigMap
      name: typesense-config
      fieldPath: data.TYPESENSE_HOST
    targets:
      - select:
          kind: HTTPRoute
          name: typesense
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=typesense].hostname
      - select:
          kind: Certificate
          name: 5stack-ssl
        fieldPaths:
          - spec.dnsNames.3
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.hostnames.5
  - source:
      kind: ConfigMap
      name: s3-config
      fieldPath: data.S3_CONSOLE_HOST
    targets:
      - select:
          kind: HTTPRoute
          name: s3-console
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=s3-console].hostname
      - select:
          kind: Certificate
          name: 5stack-ssl
        fieldPaths:
          - spec.dnsNames.4
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.hostnames.6
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.WS_DOMAIN
    targets:
      - select:
          kind: HTTPRoute
          name: ws
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=ws].hostname
      - select:
          kind: Certificate
          name: 5stack-ssl
        fieldPaths:
          - spec.dnsNames.5
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.hostnames.3
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.RELAY_DOMAIN
    targets:
      - select:
          kind: HTTPRoute
          name: relay
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=relay].hostname
      - select:
          kind: Certificate
          name: 5stack-ssl
        fieldPaths:
          - spec.dnsNames.6
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.hostnames.4
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.GAME_STREAM_DOMAIN
    targets:
      - select:
          kind: HTTPRoute
          name: mediamtx
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: HTTPRoute
          name: snapshot
        fieldPaths:
          - spec.hostnames.0
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=game-stream].hostname
      - select:
          kind: HTTPRoute
          name: https-redirect
        fieldPaths:
          - spec.hostnames.7
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.MAIL_FROM
    targets:
      - select:
          kind: Issuer
          name: 5stack-issuer
        fieldPaths:
          - spec.acme.email

patches:
  - target:
      group: gateway.networking.k8s.io
      kind: Gateway
      name: 5stack
    path: gateway-patch.yaml
