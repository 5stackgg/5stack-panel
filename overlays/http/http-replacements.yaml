replacements:
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.WEB_DOMAIN
    targets:
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=web].hostname
      - select:
          kind: Middleware
          name: mediamtx-cors
        fieldPaths:
          - spec.headers.accessControlAllowOriginList.0
        options:
          delimiter: "://"
          index: 1
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.API_DOMAIN
    targets:
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=api].hostname
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.DEMOS_DOMAIN
    targets:
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=demos].hostname
  - source:
      kind: ConfigMap
      name: typesense-config
      fieldPath: data.TYPESENSE_HOST
    targets:
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=typesense].hostname
  - source:
      kind: ConfigMap
      name: s3-config
      fieldPath: data.S3_CONSOLE_HOST
    targets:
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=s3-console].hostname
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.WS_DOMAIN
    targets:
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=ws].hostname
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.RELAY_DOMAIN
    targets:
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=relay].hostname
  - source:
      kind: ConfigMap
      name: mediamtx-env
      fieldPath: data.GAME_STREAM_DOMAIN
    targets:
      - select:
          kind: Gateway
          name: 5stack
        fieldPaths:
          - spec.listeners.[name=game-stream].hostname
  - source:
      kind: ConfigMap
      name: api-config
      fieldPath: data.MAIL_FROM
    targets:
      - select:
          kind: Issuer
          name: 5stack-issuer
        fieldPaths:
          - spec.acme.email
