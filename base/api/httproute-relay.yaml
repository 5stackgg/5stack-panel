apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: relay
  namespace: 5stack
spec:
  parentRefs:
    - name: 5stack
      sectionName: relay
  rules:
    - filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /match-relay/
      backendRefs:
        - name: api
          port: 5585
