{{- /*
The certificate traefik-gateway's websecure listener terminates on. Reverse
proxies forward to the node over HTTPS without checking it, as they did with
ingress-nginx's self-signed one, so it's made here rather than issued: this
chart also installs on clusters with nothing else to provide it.

An existing one is rendered back exactly as it is, so an upgrade changes
nothing, until it's within 30 days of the expiry recorded in its annotation;
then, or without a cluster to look in (helm template), a new one is made.
*/ -}}
{{- $name := "traefik-gateway-tls" }}
{{- $expiresKey := "gateway.5stack.gg/not-after" }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name | default dict }}
{{- $data := $existing.data | default dict }}
{{- $expires := index (($existing.metadata | default dict).annotations | default dict) $expiresKey | default "0" }}
{{- $now := now | unixEpoch | atoi }}
{{- $keep := and (hasKey $data "tls.crt") (hasKey $data "tls.key") (gt (atoi $expires) (add $now 2592000)) }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if $keep }}
{{- $crt = index $data "tls.crt" }}
{{- $key = index $data "tls.key" }}
{{- else }}
{{- $cert := genSelfSignedCert "traefik-gateway" nil nil 3650 }}
{{- $crt = $cert.Cert | b64enc }}
{{- $key = $cert.Key | b64enc }}
{{- $expires = add $now (mul 3650 86400) | toString }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{ $expiresKey }}: {{ $expires | quote }}
type: kubernetes.io/tls
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
