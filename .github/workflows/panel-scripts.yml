name: Panel scripts

on:
  push:
    branches: [main]
    paths:
      - debug.sh
      - dev.sh
      - plugin.sh
      - update.sh
      - Tiltfile
      - "utils/**"
      - "overlays/**/*.env.example"
      - base/api/deployment.yaml
      - base/hasura/deployment.yaml
      - "tests/scripts/**"
      - base/kustomization.yaml
      - "base/system-upgrade/**"
      - .github/workflows/panel-scripts.yml
  pull_request:
    paths:
      - debug.sh
      - dev.sh
      - plugin.sh
      - update.sh
      - Tiltfile
      - "utils/**"
      - "overlays/**/*.env.example"
      - base/api/deployment.yaml
      - base/hasura/deployment.yaml
      - "tests/scripts/**"
      - base/kustomization.yaml
      - "base/system-upgrade/**"
      - .github/workflows/panel-scripts.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x utils/ensure_auth_cookie_domain.sh utils/ensure_node_ip.sh utils/dev_game_server.sh utils/gpu_nodes.sh tests/scripts/*.sh tests/scripts/stub/kubectl
      - run: bash tests/scripts/setup_env_test.sh
      - run: bash tests/scripts/debug_test.sh
      - run: bash tests/scripts/startup_probe_test.sh
      - run: bash tests/scripts/system_upgrade_test.sh
      - run: bash tests/scripts/plugin_test.sh
      - run: bash tests/scripts/node_ip_test.sh
      - run: bash tests/scripts/traefik_install_test.sh
      - run: bash tests/scripts/write_overlays_test.sh
      - run: bash tests/scripts/dev_game_server_test.sh
      - run: bash tests/scripts/gpu_nodes_test.sh
