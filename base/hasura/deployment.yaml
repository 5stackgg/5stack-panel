apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hasura
  name: hasura
  namespace: 5stack
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hasura
  template:
    metadata:
      labels:
        app: hasura
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: 5stack-hasura
                operator: In
                values:
                  - "true"
      containers:
        - image: hasura/graphql-engine:v2.51.3-ce.cli-migrations-v3@sha256:fc93e226608dcd44fa57968d74f8ed1854d7075825d1f8655fa0c9f2a6a9846d
          name: hasura
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
          ports:
            - containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          envFrom:
            - secretRef:
                name: hasura-secrets  
          env:
            # Hasura's runtime threads and allocation area; its own defaults are
            # one thread per core and 4 MB. Polling subscriptions comes in
            # bursts: with 2 threads, 1,000 users in the api's load lab waited
            # 6.4 s (p95) for first data, 1.2 s with 4. Every time a thread's
            # area fills, all of them stop to collect: at 3,000 users 64 MB
            # took that p95 from 13.7 s to 2.2 s and halved Hasura's CPU, for
            # about 140 MB more memory when idle and less under load.
            - name: GHCRTS
              value: "-N4 -A64m"
            # How many viewers of one subscription share a statement (Hasura's
            # default is 100). Postgres plans each statement, so fewer of them
            # halved its time at 1,000 users in the api's load lab.
            - name: HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE
              value: "1000"
            # How often live subscriptions poll (Hasura's default is 1 s). At
            # 2,000 users in the api's load lab, 2 s halved Postgres's work and
            # took query p95 from 1.2 s to 212 ms. Vetoes stream instead.
            - name: HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL
              value: "2000"
            # Streaming subscriptions have their own interval. The veto screens
            # stream (api#829): an empty primary-key read between moves, so a
            # pick reaches the other team within half a second.
            - name: HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_REFETCH_INTERVAL
              value: "500"
            - name: HASURA_GRAPHQL_CONFIGURED_HEADER_PRECEDENCE
              value: "true"
            - name: HASURA_GRAPHQL_DEV_MODE
              value: "true"
            - name: HASURA_GRAPHQL_ENABLE_CONSOLE
              value: "true"
            - name: HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES
              value: "true"
            - name: HASURA_GRAPHQL_AUTH_HOOK
              value: "http://api:5585/hasura"
            - name: HASURA_GRAPHQL_EVENT_HOOK
              value: "http://api:5585/hasura/events"
            - name: HASURA_GRAPHQL_ACTIONS_HOOK
              value: "http://api:5585/hasura/actions"
            - name: HASURA_GRAPHQL_LOG_LEVEL
              value: "warn"
            - name: HASURA_GRAPHQL_ENABLE_TELEMETRY
              value: "false"
            - name: HASURA_GRAPHQL_METADATA_DIR
              value: /app/hasura/metadata
            - name: POSTGRES_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secrets
                  key: POSTGRES_CONNECTION_STRING
            # Hasura prepares its statements, and a generic plan gets each one
            # planned once per connection instead of on every subscription poll
            # (half of Postgres's CPU in the api's load lab). Set here, for
            # Hasura's connections only, whether the secret comes from Vault or not.
            - name: HASURA_GRAPHQL_DATABASE_URL
              value: "$(POSTGRES_CONNECTION_STRING)?options=-c%20plan_cache_mode%3Dforce_generic_plan"
          volumeMounts:
            - mountPath: /app
              name: workdir
      initContainers:
        - name: migrations
          image: ghcr.io/5stackgg/api:latest
          command:
            - /bin/sh
            - -c
            - |
              cp -r /opt/5stack/hasura /app &&
              node dist/src/main.js
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:  
                name: api-secrets
            - secretRef:  
                name: steam-secrets
            - secretRef:
                name: hasura-secrets
            - secretRef:  
                name: typesense-secrets
            - secretRef:
                name: discord-secrets
            - secretRef:
                name: redis-secrets
            - secretRef:
                name: timescaledb-secrets
            - configMapRef:
                name: s3-config
          env:
            - name: RUN_MIGRATIONS
              value: "true"
          volumeMounts:
            - mountPath: /app
              name: workdir
      volumes:
        - emptyDir: {}
          name: workdir
        - name: timescaledb-secrets
          secret:
            secretName: timescaledb-secrets