name: Panel scripts

on:
  push:
    branches: [main]
    paths:
      - debug.sh
      - utils/generate_vapid_keys.sh
      - base/api/deployment.yaml
      - base/hasura/deployment.yaml
      - "tests/scripts/**"
      - .github/workflows/panel-scripts.yml
  pull_request:
    paths:
      - debug.sh
      - utils/generate_vapid_keys.sh
      - base/api/deployment.yaml
      - base/hasura/deployment.yaml
      - "tests/scripts/**"
      - .github/workflows/panel-scripts.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x utils/generate_vapid_keys.sh tests/scripts/*.sh tests/scripts/stub/kubectl
      - run: bash tests/scripts/vapid_keys_test.sh
      - run: bash tests/scripts/debug_test.sh
      - run: bash tests/scripts/startup_probe_test.sh
