    nginx.ingress.kubernetes.io/client-max-body-size: 4G
    nginx.ingress.kubernetes.io/proxy-body-size: 4G
  name: api
  namespace: 5stack
spec:
  ingressClassName: nginx
  rules:
  - host: api.5stack.test
    http:
      paths:
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /me
        pathType: Exact
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /matches
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /twitch
        pathType: Prefix
      - backend:
          service:
            name: hasura
            port:
              number: 8080
        path: /v1
        pathType: Prefix
      - backend:
          service:
            name: hasura
            port:
              number: 8080
        path: /v1alpha1
        pathType: Prefix
      - backend:
          service:
            name: hasura
            port:
              number: 8080
        path: /v2
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /game-server-node/script
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /game-server-node/ping
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /avatars
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /trophies
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /system/healthz
        pathType: Exact
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /system/logs/download
        pathType: Exact
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /branding
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /news
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /utility
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /custom-pages
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /plugins
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
