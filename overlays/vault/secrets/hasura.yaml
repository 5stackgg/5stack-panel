apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hasura-secrets
  namespace: 5stack
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: secretstore-5stack
    kind: SecretStore
  target:
    name: hasura-secrets
  data:
    - secretKey: HASURA_GRAPHQL_ADMIN_SECRET
      remoteRef:
        key: hasura
        property: HASURA_GRAPHQL_ADMIN_SECRET 