apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: 5stack
spec:
  parentRefs:
    - name: 5stack
      sectionName: web
  hostnames:
    - ${WEB_DOMAIN}
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: compress
      backendRefs:
        - name: web
          port: 3000
