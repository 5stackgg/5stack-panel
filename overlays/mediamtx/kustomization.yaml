apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: 5stack

resources:
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - middlewares.yaml

configMapGenerator:
  - name: mediamtx-config
    namespace: 5stack
    files:
      - mediamtx.yml
  - name: mediamtx-env
    namespace: 5stack
    envs:
      - mediamtx.env
