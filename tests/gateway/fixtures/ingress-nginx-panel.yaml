---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /healthz
  name: hasura
  namespace: 5stack
spec:
  ingressClassName: nginx
  rules:
  - host: api.5stack.test
    http:
      paths:
      - backend:
          service:
            name: hasura
            port:
              number: 8080
        path: /v2/healthz
        pathType: Exact
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/auth-cache-duration: 200 30s
    nginx.ingress.kubernetes.io/auth-cache-key: $http_cookie$mediamtx_path
    nginx.ingress.kubernetes.io/auth-url: http://api.5stack.svc.cluster.local:5585/streams/authorize
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
    nginx.ingress.kubernetes.io/cors-allow-headers: Content-Type, Accept, Authorization,
      If-Match
    nginx.ingress.kubernetes.io/cors-allow-methods: GET, POST, OPTIONS, PATCH, DELETE
    nginx.ingress.kubernetes.io/cors-allow-origin: https://5stack.test
    nginx.ingress.kubernetes.io/cors-expose-headers: Location
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/use-regex: "true"
  name: mediamtx
  namespace: 5stack
spec:
  ingressClassName: nginx
  rules:
  - host: hls.5stack.test
    http:
      paths:
      - backend:
          service:
            name: mediamtx
            port:
              number: 8889
        path: /(?<mediamtx_path>[^/]+)/(whep|whip)(/[^/]+)?$
        pathType: ImplementationSpecific
      - backend:
          service:
            name: mediamtx
            port:
              number: 8888
        path: /(?<mediamtx_path>[^/]+)/([^/]+\.[^/]+)?$
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - hls.5stack.test
    secretName: 5stack-mediamtx-ssl
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /match-relay/$1
  name: relay
  namespace: 5stack
spec:
  ingressClassName: nginx
  rules:
  - host: tv.5stack.test
    http:
      paths:
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /(.*)
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - tv.5stack.test
    secretName: 5stack-ssl
---
apiVersion: networking.k8s.io/v1
