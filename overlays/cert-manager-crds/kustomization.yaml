apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - cert-manager.yaml

# cert-manager runs next to the api, so a game node going down never takes
# certificate renewals or its admission webhook with it.
patches:
  - path: panel-node.yaml
    target:
      kind: Deployment
      namespace: cert-manager
