apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mediamtx-secrets
  namespace: 5stack
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: secretstore-5stack
    kind: SecretStore
  target:
    name: mediamtx-secrets
  data:
    - secretKey: MEDIAMTX_API_PASSWORD
      remoteRef:
        key: mediamtx
        property: MEDIAMTX_API_PASSWORD
    - secretKey: MEDIAMTX_STREAMER_PASSWORD
      remoteRef:
        key: mediamtx
        property: MEDIAMTX_STREAMER_PASSWORD
    - secretKey: MEDIAMTX_RELAY_PASSWORD
      remoteRef:
        key: mediamtx
        property: MEDIAMTX_RELAY_PASSWORD
    - secretKey: MEDIAMTX_VIEWER_PASSWORD
      remoteRef:
        key: mediamtx
        property: MEDIAMTX_VIEWER_PASSWORD
