apiVersion: v1
kind: ConfigMap
metadata:
  name: plugin-db-pooler
  namespace: 5stack
data:
  pgbouncer.ini: |
    [databases]
    * = host=timescaledb port=5432

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 6432
    unix_socket_dir =

    ; Only plugin roles get in: the lookup returns nothing for any other name.
    auth_type = scram-sha-256
    auth_file = /var/run/plugin-db-pooler/userlist.txt
    auth_user = pgbouncer_auth
    auth_dbname = hasura
    auth_query = SELECT usename, passwd FROM pgbouncer.plugin_user_lookup($1)

    ; Many game servers share few real connections. Npgsql prepares on the
    ; protocol level, which transaction pooling needs max_prepared_statements for.
    pool_mode = transaction
    max_prepared_statements = 200
    default_pool_size = 20
    max_db_connections = 100
    max_client_conn = 2000
    track_extra_parameters = IntervalStyle, search_path
    ignore_startup_parameters = extra_float_digits, options

    server_tls_sslmode = prefer
    log_connections = 0
    log_disconnections = 0
