apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: typesense
  namespace: 5stack
spec:
  parentRefs:
    - name: 5stack
      sectionName: typesense
  hostnames:
    - ${TYPESENSE_HOST}
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: typesense
          port: 8108
