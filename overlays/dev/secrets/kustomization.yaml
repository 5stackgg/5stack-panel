apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base
  - ../../nvidia

secretGenerator:
  - name: api-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - api-secrets.env

  - name: push-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - push-secrets.env

  - name: timescaledb-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - timescaledb-secrets.env
  - name: tailscale-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - tailscale-secrets.env
  - name: steam-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - steam-secrets.env
  - name: hasura-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - hasura-secrets.env
  - name: discord-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - discord-secrets.env
  - name: s3-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - s3-secrets.env
  - name: redis-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - redis-secrets.env
  - name: typesense-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - typesense-secrets.env
  - name: rustfs-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - rustfs-secrets.env
  # The api names mediamtx-secrets in the streamer Jobs it creates, so it keeps
  # its name. mediamtx-passwords holds the same values under a hashed name, so
  # MediaMTX and the api roll when one changes.
  - name: mediamtx-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - mediamtx-secrets.env
    options:
      disableNameSuffixHash: true
  - name: mediamtx-passwords
    type: Opaque
    namespace: 5stack
    envs:
      - mediamtx-secrets.env
  - name: faceit-secrets
    type: Opaque
    namespace: 5stack
    envs:
      - faceit-secrets.env
