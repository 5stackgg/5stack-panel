apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hasura
  namespace: 5stack
spec:
  parentRefs:
    - name: 5stack
      sectionName: api
  hostnames:
    - ${API_DOMAIN}
  rules:
    - matches:
        - path:
            type: Exact
            value: /v2/healthz
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /healthz
      backendRefs:
        - name: hasura
          port: 8080
