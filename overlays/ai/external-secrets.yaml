apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ai-secrets
  namespace: 5stack
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: secretstore-5stack
    kind: SecretStore
  target:
    name: ai-secrets
  data:
    - secretKey: AI_SERVICE_SECRET
      remoteRef:
        key: ai
        property: AI_SERVICE_SECRET
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: ai
        property: ANTHROPIC_API_KEY
    - secretKey: AI_DATABASE_PASSWORD
      remoteRef:
        key: ai
        property: AI_DATABASE_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ghcr-pull
  namespace: 5stack
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: secretstore-5stack
    kind: SecretStore
  target:
    name: ghcr-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "%s:%s" .username .token | b64enc }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: ai
        property: GHCR_USERNAME
    - secretKey: token
      remoteRef:
        key: ai
        property: GHCR_TOKEN
