apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: acme-check
  namespace: 5stack
spec:
  headers:
    customResponseHeaders:
      X-5Stack-Check: acme-path
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acme-check
  namespace: 5stack
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.priority: "1000000"
    traefik.ingress.kubernetes.io/router.middlewares: 5stack-acme-check@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /.well-known/acme-challenge/5stack-check
            pathType: Exact
            backend:
              service:
                name: web
                port:
                  number: 3000
