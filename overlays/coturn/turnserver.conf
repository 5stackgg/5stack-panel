# TURN for voice and video calls only.
#
# Deliberately NOT used by the regional matchmaking latency probes: those open a
# WebRTC data channel per region and time it, so a relay candidate would measure
# the hop to this box instead of the region and quietly break region selection.
# Nor by game streams or demo playback, where relaying the media would be a
# bandwidth disaster. The web app opts in per call site; see useIceServers.ts.

listening-port=3478

# Credentials are minted by the API, signed with the shared secret, and expire
# on their own. Nothing long-lived is ever handed to a browser, and there are no
# user accounts here to manage.
use-auth-secret

fingerprint

# The relay port range, the realm and the shared secret are passed as flags by
# the deployment instead of living here: coturn does not interpolate environment
# variables into its config file, and the secret must never sit in a ConfigMap.
# See TURN_MIN_PORT / TURN_MAX_PORT in coturn.env.

# A relay that will forward to anything is an open proxy: it can be pointed at
# the cluster's own services, at link-local metadata endpoints, or at a third
# party as a reflector. Peers are the public internet only.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Nothing here needs a database, a CLI listener or a web admin -- all three are
# attack surface for a process that only has to forward packets.
no-cli
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Depth rather than breadth: one client should not be able to exhaust the relay
# range on its own.
user-quota=12
total-quota=1200

no-tlsv1
no-tlsv1_1

# stdout, so it lands in `kubectl logs` like everything else.
log-file=stdout
simple-log
