apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
  namespace: 5stack
  labels:
    app: mediamtx
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mediamtx
  template:
    metadata:
      labels:
        app: mediamtx
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # GAME_STREAM_DOMAIN and the STUN host are resolved on every WebRTC
      # session. With the cluster default of ndots:5 each lookup walks the
      # search domains first; ndots:1 sends public names straight upstream.
      dnsConfig:
        options:
          - { name: ndots, value: "1" }
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: 5stack-mediamtx
                operator: In
                values:
                  - "true"
      containers:
        - name: mediamtx
          image: bluenviron/mediamtx:1.21.1
          env:
            # Bind SRT/WebRTC to a specific host IP (not :wildcard) so UDP
            # reply packets keep a symmetric 4-tuple — otherwise pod-CIDR
            # clients see replies sourced from cni0 and SRT drops them.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            # Public hostname for WebRTC ICE — must resolve to a public
            # IP that has UDP/8189 reachable from outside-LAN viewers.
            - name: GAME_STREAM_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: mediamtx-env
                  key: GAME_STREAM_DOMAIN
            - name: MTX_SRTADDRESS
              value: "$(HOST_IP):8890"
            # Pin WebRTC media to a single UDP port so the public
            # port-forward / firewall rule is one line, not a range.
            - name: MTX_WEBRTCLOCALUDPADDRESS
              value: ":8189"
            # ICE host candidates advertised to viewers. Public hostname
            # for outside-LAN browsers; host IP for on-LAN/on-tailnet.
            - name: MTX_WEBRTCADDITIONALHOSTS
              value: "$(GAME_STREAM_DOMAIN),$(HOST_IP)"
            # STUN gives MediaMTX its public address as a server-reflexive
            # candidate. Without a TURN relay, that candidate is how viewers
            # still connect (by hole punching) when UDP/8189 is not forwarded
            # to this node. Do not remove it.
            - name: MTX_WEBRTCICESERVERS2_0_URL
              value: "stun:stun.l.google.com:19302"
          ports:
            - { name: hls,      containerPort: 8888, protocol: TCP }
            - { name: whip,     containerPort: 8889, protocol: TCP }
            - { name: srt,      containerPort: 8890, protocol: UDP }
            - { name: api,      containerPort: 9997, protocol: TCP }
            - { name: metrics,  containerPort: 9998, protocol: TCP }
            - { name: webrtc,   containerPort: 8189, protocol: UDP }
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
          # Every WebRTC packet for streams, voice and cameras goes through
          # this one process, on the node that also runs Postgres and the API.
          # No CPU limit: throttling a media relay shows up as jitter.
          resources:
            requests: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
