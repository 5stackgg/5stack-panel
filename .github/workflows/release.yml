name: Release

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Cloudflare workers, Gateway, Gateway chart, Panel scripts, TimescaleDB upgrade]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  dispatch:
    if: github.event_name == 'push' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Give the checks time to register
        if: github.event_name == 'push'
        run: sleep 90
      - name: Start the release in 5stack-service
        env:
          GH_TOKEN: ${{ secrets.RELEASE_DISPATCH_TOKEN }}
        run: gh workflow run panel-release.yml -R 5stackgg/5stack-service --ref main
