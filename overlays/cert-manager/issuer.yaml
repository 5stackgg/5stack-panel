apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  namespace: 5stack
  name: 5stack-issuer
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: ${ACME_EMAIL}
    privateKeySecretRef:
      name: 5stack-issuer
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
            # Plain HTTP only, and above the https-redirect route on the same
            # hosts, so Let's Encrypt reaches the solver instead of a 308.
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
                  traefik.ingress.kubernetes.io/router.priority: "1000000"
