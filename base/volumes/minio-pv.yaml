# RustFS serves this volume now, but every identifier here deliberately keeps
# the MinIO name. The migration is an in-place read of the existing data
# directory: renaming the PV forces a rebind, and renaming the hostPath would
# be a full copy -- or an outright failure -- for anyone who mounted a
# dedicated disk at /opt/5stack/minio to hold their demos.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: minio-pv
  namespace: 5stack
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-storage
  local:
    path: /opt/5stack/minio
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: 5stack-minio
          operator: In
          values:
          - "true"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: 5stack
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-storage
  resources:
    requests:
      storage: 2Gi
  volumeName: minio-pv