            port:
              number: 5585
        path: /auth
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /extension
        pathType: Prefix
      - backend:
          service:
            name: api
            port:
              number: 5585
        path: /telemetry
        pathType: Exact
      - backend:
          service:
            name: api
            port:
              number: 5585
