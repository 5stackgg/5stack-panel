logLevel: info
logDestinations: [stdout]

api: yes
apiAddress: :9997

# Prometheus metrics. The API above is what the panel's own admin view reads --
# it gives structured per-path detail this cannot -- but this is here for anyone
# already scraping, and costs nothing when nobody is. authInternalUsers below
# has always granted the `metrics` action; only the listener was missing.
metrics: yes
metricsAddress: :9998

authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
      - action: api
      - action: metrics
      - action: pprof

hls: yes
hlsAddress: :8888
hlsAllowOrigins: ["*"]
hlsVariant: fmp4
hlsSegmentCount: 7
hlsSegmentDuration: 1s

webrtc: yes
webrtcAddress: :8889

webrtcAllowOrigins: ["*"]

srt: yes
srtAddress: :8890

rtmp: yes
rtmpAddress: :1935

pathDefaults:
  source: publisher
  sourceOnDemand: no

paths:
  all_others:
