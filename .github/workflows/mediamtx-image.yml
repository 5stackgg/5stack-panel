name: MediaMTX image

on:
  push:
    branches: [main]
    paths:
      - "images/mediamtx/**"
      - .github/workflows/mediamtx-image.yml
  pull_request:
    paths:
      - "images/mediamtx/**"
      - .github/workflows/mediamtx-image.yml

concurrency:
  group: mediamtx-image-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: |
          arg() { sed -n "s/^ARG $1=v//p" images/mediamtx/Dockerfile; }
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mediamtx:$(arg MEDIAMTX_VERSION)-astits$(arg ASTITS_VERSION)" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A published tag is never pushed again: the panel pins its digest. Bump an ARG to publish.
      - id: published
        if: github.event_name == 'push'
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE is already published"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: images/mediamtx
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}
