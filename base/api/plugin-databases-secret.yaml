# The plugin databases' passwords, one key per database. The api writes them;
# this manifest only makes sure the Secret exists, so it never lists any data:
# kubectl apply removes only the fields it applied before, and it never
# applied the api's keys, so an update leaves them in place.
apiVersion: v1
kind: Secret
metadata:
  name: plugin-databases
  namespace: 5stack
type: Opaque
