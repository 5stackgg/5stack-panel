apiVersion: apps/v1
kind: Deployment
metadata:
  name: plugin-db-pooler
  namespace: 5stack
  labels:
    app: plugin-db-pooler
spec:
  # One pod at a time: each start gives pgbouncer_auth a new password, which
  # an older pod still running would no longer have.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plugin-db-pooler
  template:
    metadata:
      labels:
        app: plugin-db-pooler
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: 5stack-timescaledb
                    operator: In
                    values:
                      - 'true'
      securityContext:
        fsGroup: 996
      # pgbouncer_auth's limit stays above default_pool_size, so its auth
      # pool can't run out after a restart.
      # As the superuser, gives pgbouncer_auth a fresh password that only this
      # pod knows, so it is stored nowhere, and a lookup that returns the SCRAM
      # verifier of plugin roles only. Both live in the postgres maintenance
      # database, never the panel's own: pg_authid is shared by every
      # database. The api's lockdown closes postgres to PUBLIC and never
      # revisits it, so CONNECT is granted here.
      initContainers:
        - name: auth
          image: timescale/timescaledb:2.32.0-pg18@sha256:83952d54cfc74d9aebe4aba6ecf2af829c2bcf1f30058dded4c18ab3720a247a
          command:
            - sh
            - -c
            - |
              set -e
              umask 027
              AUTH_PASSWORD="$(head -c 48 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 40)"
              export PGPASSWORD="$POSTGRES_PASSWORD"
              psql -h timescaledb -U hasura -d postgres -v ON_ERROR_STOP=1 -v auth_password="$AUTH_PASSWORD" <<'SQL'
              SET pg_stat_statements.track_utility = off;
              SELECT 'CREATE ROLE pgbouncer_auth' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'pgbouncer_auth')\gexec
              ALTER ROLE pgbouncer_auth WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION CONNECTION LIMIT 30 PASSWORD :'auth_password';
              ALTER ROLE pgbouncer_auth SET fivestack.app_key = '';
              GRANT CONNECT ON DATABASE postgres TO pgbouncer_auth;
              CREATE SCHEMA IF NOT EXISTS pgbouncer;
              REVOKE ALL ON SCHEMA pgbouncer FROM PUBLIC;
              GRANT USAGE ON SCHEMA pgbouncer TO pgbouncer_auth;
              CREATE OR REPLACE FUNCTION pgbouncer.plugin_user_lookup(p_usename text, OUT usename text, OUT passwd text)
                RETURNS record
                LANGUAGE sql
                SECURITY DEFINER
                SET search_path = pg_catalog
                AS $lookup$
                  SELECT rolname::text, rolpassword::text
                    FROM pg_catalog.pg_authid
                   WHERE rolname = p_usename
                     AND rolname ~ '^plugin_[a-z0-9_]+$'
                     AND rolcanlogin
                     AND NOT rolsuper
                     AND (rolvaliduntil IS NULL OR rolvaliduntil > now())
                $lookup$;
              REVOKE ALL ON FUNCTION pgbouncer.plugin_user_lookup(text) FROM PUBLIC;
              GRANT EXECUTE ON FUNCTION pgbouncer.plugin_user_lookup(text) TO pgbouncer_auth;
              SQL
              printf '"pgbouncer_auth" "%s"\n' "$AUTH_PASSWORD" > /var/run/plugin-db-pooler/userlist.txt
              chgrp 996 /var/run/plugin-db-pooler/userlist.txt
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: timescaledb-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: auth
              mountPath: /var/run/plugin-db-pooler
      containers:
        - name: pgbouncer
          image: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:6c91fd7383b8b098bc0c3b71dba4e98bd568c0d301b9fc66027fbc23259c6a7d
          args:
            - /etc/pgbouncer/pgbouncer.ini
          securityContext:
            runAsNonRoot: true
            runAsUser: 998
            runAsGroup: 996
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          ports:
            - containerPort: 6432
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: 6432
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            tcpSocket:
              port: 6432
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6432
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer/pgbouncer.ini
              subPath: pgbouncer.ini
              readOnly: true
            - name: auth
              mountPath: /var/run/plugin-db-pooler
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: plugin-db-pooler
        - name: auth
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
