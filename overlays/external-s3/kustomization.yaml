apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - target:
      kind: StatefulSet
      name: rustfs
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: rustfs
  - target:
      kind: Service
      name: rustfs
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: rustfs
  - target:
      kind: Service
      name: minio
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: minio
  - target:
      kind: PersistentVolume
      name: minio-pv
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolume
      metadata:
        name: minio-pv
  - target:
      kind: PersistentVolumeClaim
      name: minio-pvc
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: minio-pvc
  - target:
      kind: Secret
      name: rustfs-secrets
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: rustfs-secrets
  - target:
      kind: ExternalSecret
      name: rustfs-secrets
    patch: |-
      $patch: delete
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        name: rustfs-secrets
  - target:
      kind: HTTPRoute
      name: demos
    patch: |-
      - op: test
        path: /spec/rules/1/backendRefs/0/name
        value: rustfs
      - op: remove
        path: /spec/rules/1
