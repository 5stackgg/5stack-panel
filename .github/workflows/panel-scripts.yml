name: Panel scripts

on:
  push:
    branches: [main]
    paths:
      - debug.sh
      - dev.sh
      - plugin.sh
      - "utils/**"
      - "overlays/**/*.env.example"
      - base/api/deployment.yaml
      - base/hasura/deployment.yaml
      - "tests/scripts/**"
      - .github/workflows/panel-scripts.yml
  pull_request:
    paths:
      - debug.sh
      - dev.sh
      - plugin.sh
      - "utils/**"
      - "overlays/**/*.env.example"
      - base/api/deployment.yaml
      - base/hasura/deployment.yaml
      - "tests/scripts/**"
      - .github/workflows/panel-scripts.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x utils/ensure_auth_cookie_domain.sh tests/scripts/*.sh tests/scripts/stub/kubectl
      - run: bash tests/scripts/setup_env_test.sh
      - run: bash tests/scripts/debug_test.sh
      - run: bash tests/scripts/startup_probe_test.sh
      - run: bash tests/scripts/plugin_test.sh
