name: Gateway chart

# Publishes charts/gateway-crds and charts/gateway as OCI charts at
# ghcr.io/5stackgg/charts/<name>, tagged with the version in their Chart.yaml.
on:
  push:
    branches: [main]
    paths:
      - "charts/gateway/**"
      - "charts/gateway-crds/**"
      - .github/workflows/gateway-chart.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - run: |
          helm package charts/gateway-crds --destination dist
          helm package charts/gateway --destination dist
          for chart in dist/*.tgz; do
            helm push "$chart" oci://ghcr.io/5stackgg/charts
          done
