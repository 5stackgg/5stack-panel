name: Panel scripts

on:
  push:
    branches: [main]
    paths:
      - custom.sh
      - debug.sh
      - dev.sh
      - plugin.sh
      - service.sh
      - setup-gpu-nodes.sh
      - "gpu-node/**"
      - update.sh
      - Tiltfile
      - "utils/**"
      - "overlays/**/*.env.example"
      - base/api/deployment.yaml
      - base/hasura/deployment.yaml
      - "tests/scripts/**"
      - base/kustomization.yaml
      - base/api/httproute.yaml
      - "base/rustfs/**"
      - "overlays/external-s3/**"
      - "base/system-upgrade/**"
      - "base/backups/**"
      - "base/game-server-node-connector/**"
      - "overlays/nvidia/**"
      - cloudflare.sh
      - stream-relay.sh
      - "cloudflare-workers/stream-relay/**"
      - "overlays/cert-manager/**"
      - "overlays/http/**"
      - ".github/scripts/**"
      - .github/workflows/panel-scripts.yml
  pull_request:
    paths:
      - custom.sh
      - debug.sh
      - dev.sh
      - plugin.sh
      - service.sh
      - setup-gpu-nodes.sh
      - "gpu-node/**"
      - update.sh
      - Tiltfile
      - "utils/**"
      - "overlays/**/*.env.example"
      - base/api/deployment.yaml
      - base/hasura/deployment.yaml
      - "tests/scripts/**"
      - base/kustomization.yaml
      - base/api/httproute.yaml
      - "base/rustfs/**"
      - "overlays/external-s3/**"
      - "base/system-upgrade/**"
      - "base/backups/**"
      - "base/game-server-node-connector/**"
      - "overlays/nvidia/**"
      - cloudflare.sh
      - stream-relay.sh
      - "cloudflare-workers/stream-relay/**"
      - "overlays/cert-manager/**"
      - "overlays/http/**"
      - ".github/scripts/**"
      - .github/workflows/panel-scripts.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x cloudflare.sh stream-relay.sh utils/cloudflare_api.sh utils/cloudflare_setup.sh service.sh utils/ensure_auth_cookie_domain.sh utils/ensure_node_ip.sh utils/dev_game_server.sh utils/gpu_nodes.sh utils/choose_node.sh .github/scripts/image_updates.sh gpu-node/*.sh tests/scripts/*.sh tests/scripts/stub/kubectl tests/scripts/stub/crane tests/scripts/tailscale-stub/curl tests/scripts/tailscale-stub/kubectl
      - run: bash tests/scripts/setup_env_test.sh
      - run: bash tests/scripts/apply_overlay_test.sh
      - run: bash tests/scripts/debug_test.sh
      - run: bash tests/scripts/startup_probe_test.sh
      - run: bash tests/scripts/system_upgrade_test.sh
      - run: bash tests/scripts/plugin_test.sh
      - run: bash tests/scripts/node_ip_test.sh
      - run: bash tests/scripts/traefik_install_test.sh
      - run: bash tests/scripts/write_overlays_test.sh
      - run: bash tests/scripts/cloudflare_setup_test.sh
      - run: bash tests/scripts/dev_game_server_test.sh
      - run: bash tests/scripts/gpu_nodes_test.sh
      - run: bash tests/scripts/service_test.sh
      - run: bash tests/scripts/postgres_backup_test.sh
      - run: bash tests/scripts/choose_node_test.sh
      - run: bash tests/scripts/nvidia_fallback_test.sh
      - run: bash tests/scripts/image_updates_test.sh
      - run: bash tests/scripts/tailscale_api_test.sh
      - run: bash tests/scripts/proxmox_gpu_lxc_test.sh
      - run: bash tests/scripts/gpu_node_check_test.sh
